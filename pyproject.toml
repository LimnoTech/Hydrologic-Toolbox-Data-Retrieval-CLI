[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waterdata-toolbox-demo"
version = "0.1.0"
description = "CSV-only CLI and GUI app for Water Data ToolBox demo workflows."
readme = "src/waterdata_toolbox_demo/waterdata-package-cli-gui.md"
requires-python = ">=3.11"
dependencies = [
    "dataretrieval",
    "pandas",
    "geopandas",
    "pyshp",
]

[project.optional-dependencies]
build = ["pyinstaller"]

[project.scripts]
waterdata-toolbox-demo = "waterdata_toolbox_demo.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
waterdata-toolbox-demo = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
build = { features = ["build"], solve-group = "default" }

[tool.pixi.tasks]
