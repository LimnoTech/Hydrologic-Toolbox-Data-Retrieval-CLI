[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "hydrologic-toolbox-data-retrieval-cli"
dynamic = ["version"]
description = "CLI-only app for Hydrologic Toolbox data retrieval workflows."
readme = "README.md"
license = "MIT"
license-files = ["License.md"]
requires-python = ">=3.11"
authors = [
  { name = "LimnoTech" },
  { name = "Luka Ludden" },
  { name = "Anthony Aufdenkampe", email = "aaufdenkampe@limno.com" },
]
maintainers = [
  { name = "Anthony Aufdenkampe", email = "aaufdenkampe@limno.com" },
]
keywords = [
  "usgs",
  "water-data",
  "hydrology",
  "hydrologic-toolbox",
  "dataretrieval",
  "shapefile",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Hydrology",
]

# The PyPI-name half of the dual declaration; tests/test_dependency_parity.py keeps it in
# step with [tool.pixi.feature.core.dependencies].
dependencies = [
  "dataretrieval>=1.3,<1.4",  # <1.4 is temporary: group 3 of the 1.4 round raises it to >=1.4
  "geopandas",
  "pandas",
  "pyproj",
  "pyshp",
]

[project.optional-dependencies]
jupyter = [
  "jupyterlab",
  "jupytext",
  "matplotlib",
  "ipykernel",
]

[project.urls]
Homepage = "https://github.com/LimnoTech/Hydrologic-Toolbox-Data-Retrieval-CLI"
Repository = "https://github.com/LimnoTech/Hydrologic-Toolbox-Data-Retrieval-CLI"
Issues = "https://github.com/LimnoTech/Hydrologic-Toolbox-Data-Retrieval-CLI/issues"

[project.scripts]
hydrologic-toolbox-data-retrieval-cli = "hydrologic_toolbox_data_retrieval_cli.app:main"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

[tool.hatch.version]
source = "vcs"
# Used only when git metadata is missing (e.g. a GitHub source ZIP); tagged builds ignore it.
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/hydrologic_toolbox_data_retrieval_cli/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hydrologic_toolbox_data_retrieval_cli"]

# ---------------------------------------------------------------------------
# Pixi workspace
# ---------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge", "nodefaults"]
platforms = ["linux-64", "osx-arm64", "win-64"]

# Self-install, in the implicit default feature so every environment gets it.
[tool.pixi.pypi-dependencies]
hydrologic-toolbox-data-retrieval-cli = { path = ".", editable = true }

# The conda-name half of the dual declaration.
[tool.pixi.feature.core.dependencies]
python = "3.12.*"
dataretrieval = ">=1.3,<1.4"
geopandas = "*"
pandas = "*"
pyproj = "*"
pyshp = "*"

[tool.pixi.feature.dev.dependencies]
pytest = "*"
ruff = "*"
pyrefly = "*"

[tool.pixi.feature.jupyter.dependencies]
jupyterlab = "*"
jupytext = "*"
matplotlib-base = "*"
ipykernel = "*"

# PyInstaller builds the Windows exe; it lives here only, so the build-exe task exists only
# in the `build` environment.
[tool.pixi.feature.build.dependencies]
pyinstaller = "*"

[tool.pixi.feature.build.tasks]
build-exe = "pyinstaller --noconfirm --clean hydrologic_toolbox_data_retrieval_cli.spec"

[tool.pixi.environments]
default = { features = ["core", "dev", "jupyter"], solve-group = "default" }
ci = { features = ["core", "dev"], solve-group = "default" }
build = { features = ["core", "build"], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest"
test-live = "pytest -m live"
# No paths: the ruff config's extend-exclude decides scope.
lint = "ruff check"
format = "ruff format"
typecheck = "pyrefly check"
cli = "python -m hydrologic_toolbox_data_retrieval_cli"

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = [
  "live: exercises the CLI against live Water Data endpoints",
]

[tool.pyrefly]
project-includes = ["src/hydrologic_toolbox_data_retrieval_cli"]
python-version = "3.12"
