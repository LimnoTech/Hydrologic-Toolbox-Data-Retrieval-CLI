[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrologic-toolbox-data-retrieval-cli"
version = "0.1.0"
description = "CLI-only app for Hydrologic Toolbox data retrieval workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dataretrieval",
    "pandas",
    "geopandas",
    "pyproj",
    "pyshp",
]

[project.optional-dependencies]
build = ["pyinstaller"]

[project.scripts]
hydrologic-toolbox-data-retrieval-cli = "hydrologic_toolbox_data_retrieval_cli.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "live: exercises the CLI against live Water Data endpoints",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
hydrologic-toolbox-data-retrieval-cli = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
build = { features = ["build"], solve-group = "default" }

[tool.pixi.tasks]
