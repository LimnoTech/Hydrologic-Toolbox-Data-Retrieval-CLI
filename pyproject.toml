[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "hydrotoolbox-dataretrieval"
dynamic = ["version"]
description = "CLI-only app for Hydrologic Toolbox data retrieval workflows."
readme = "README.md"
license = "MIT"
license-files = ["License.md"]
requires-python = ">=3.11"
authors = [
  { name = "LimnoTech" },
  { name = "Luka Ludden" },
  { name = "Anthony Aufdenkampe", email = "aaufdenkampe@limno.com" },
]
maintainers = [
  { name = "Anthony Aufdenkampe", email = "aaufdenkampe@limno.com" },
]
keywords = [
  "usgs",
  "water-data",
  "hydrology",
  "hydrologic-toolbox",
  "dataretrieval",
  "shapefile",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Hydrology",
]

# The one runtime list, in PyPI names: what src/ imports. pixi-build maps it to conda names for
# the package's record (`ignore-pypi-mapping = false` below), and every pixi environment installs
# the package through that record. tests/test_package_section.py reads the record from pixi.lock
# and fails on a requirement that did not reach it. Tool and notebook packages are in the pixi
# features, not here.
#
# geopandas maps to conda's geopandas-base, without mapclassify, scikit-learn, scipy,
# matplotlib, pyogrio or GDAL. The CLI uses none of them: shapefiles are written with pyshp,
# and pyproj is declared directly.
#
# No pyarrow: this repo is exempt from LimnoTech's rule that pandas implies pyarrow (spec
# amendment, item 4, 2026-11-16), and test_pyarrow_is_not_locked holds the exemption. On the
# Windows runner pyarrow added 23.9 MB to the zipped exe bundle (296.5 -> 320.4 MB) and 0.04 s
# to `--help`. Measured on macOS with pandas 3.1.1, it gave nothing the Toolbox would notice:
# the CLI's dataretrieval calls all take the OGC JSON path, where building the tables was
# 7-10% slower with it; `to_csv` was unchanged; memory fell 60-65%, on tables of a few MB.
# pandas 3 does not switch `read_csv` to the pyarrow engine; only string storage changes.
dependencies = [
  "dataretrieval>=1.3,<1.4",  # <1.4 is temporary: group 3 of the 1.4 round raises it to >=1.4
  "geopandas",
  "pandas",
  "pyproj",
  "pyshp",
]

[project.urls]
Homepage = "https://github.com/LimnoTech/hydrotoolbox-dataretrieval"
Repository = "https://github.com/LimnoTech/hydrotoolbox-dataretrieval"
Issues = "https://github.com/LimnoTech/hydrotoolbox-dataretrieval/issues"

[project.scripts]
hydrotoolbox-dataretrieval = "hydrotoolbox_dataretrieval.app:main"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

[tool.hatch.version]
source = "vcs"
# Used only when git metadata is missing (e.g. a GitHub source ZIP); tagged builds ignore it.
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/hydrotoolbox_dataretrieval/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hydrotoolbox_dataretrieval"]

# ---------------------------------------------------------------------------
# Pixi workspace
# ---------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge", "nodefaults"]
platforms = ["linux-64", "osx-arm64", "win-64"]
# The pixi that last wrote pixi.lock; CI pins the same version (ci.yaml). An older
# pixi can reject a newer lock as out of date, so this makes it fail clearly instead.
requires-pixi = ">=0.84.2"
# pixi-build, a preview, builds the package from this manifest (the package section below).
preview = ["pixi-build"]

# Self-install as a pixi-build source package, in the implicit default feature so every
# environment gets it: the repo installs itself through the same record a consumer would get.
[tool.pixi.dependencies]
hydrotoolbox-dataretrieval = { path = "." }

# conda-forge resolves Intel MKL as the BLAS on win-64 otherwise, and its DLLs land in the exe
# (spec amendment, item 11: the zipped bundle is held at 250 MB). A root target table belongs to
# the implicit default feature, which every environment composes, so the pin reaches them all.
[tool.pixi.target.win-64.dependencies]
libblas = { version = "*", build = "*openblas" }

# hydrotoolbox-dataretrieval as a pixi-build source package, following LimnoTech's
# packaging guide (python-scientific variant; private) and water-data-engine's pyproject.toml.
# The record pixi-build writes comes from [project.dependencies] and requires-python;
# tests/test_package_section.py reads it from pixi.lock.
[tool.pixi.package]
name = "hydrotoolbox-dataretrieval"
# The last release, bumped beside CHANGELOG.md in each release PR. It is the conda record's
# version only; __version__ still comes from hatch-vcs.
version = "0.1.0"

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "*" }

[tool.pixi.package.build.config]
# Map [project.dependencies] to conda names for the record.
ignore-pypi-mapping = false

[tool.pixi.package.host-dependencies]
hatchling = "*"
hatch-vcs = "*"
python = "3.12.*"

# Only the environment's python: the runtime list is [project.dependencies].
[tool.pixi.feature.core.dependencies]
python = "3.12.*"

[tool.pixi.feature.dev.dependencies]
pytest = "*"
pyyaml = "*"  # tests/test_package_section.py reads pixi.lock and ci.yaml
ruff = "*"
pyrefly = "*"

[tool.pixi.feature.jupyter.dependencies]
jupyterlab = "*"
jupytext = "*"
matplotlib-base = "*"
ipykernel = "*"

# PyInstaller builds the Windows exe; it lives here only, so the build-exe task exists only
# in the `build` environment.
[tool.pixi.feature.build.dependencies]
pyinstaller = "*"

[tool.pixi.feature.build.tasks]
# pixi rebuilds the source package, and with it the generated _version.py, only when the
# manifest changes, not when HEAD moves. Reinstalling just the project package makes
# hatch-vcs re-read git, so the exe never embeds a stale version.
refresh-version = "pixi reinstall --locked -e build hydrotoolbox-dataretrieval"
build-exe = { cmd = "pyinstaller --noconfirm --clean hydrotoolbox_dataretrieval.spec", depends-on = ["refresh-version"] }

[tool.pixi.environments]
default = { features = ["core", "dev", "jupyter"], solve-group = "default" }
ci = { features = ["core", "dev"], solve-group = "default" }
build = { features = ["core", "build"], solve-group = "default" }

# conda-forge proj's activation script turns PROJ_NETWORK on when proj-data is absent, so
# PROJ fetches datum grids from cdn.proj.org. The frozen exe never fetches grids; this
# matches it and keeps outputs and tests offline and deterministic.
[tool.pixi.activation.env]
PROJ_NETWORK = "OFF"

[tool.pixi.tasks]
test = "pytest"
test-live = "pytest -m live"
# No paths: the ruff config's extend-exclude decides scope.
lint = "ruff check"
format = "ruff format"
typecheck = "pyrefly check"
cli = "python -m hydrotoolbox_dataretrieval"

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = [
  "live: exercises the CLI against live Water Data endpoints",
]

[tool.ruff]
line-length = 88
extend-exclude = ["examples"]

[tool.ruff.format]
exclude = ["docs/superpowers/**"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
  "F", "E", "W", "I", "UP", "B", "Q", "SIM", "TID", "C90", "PLW1514",
  # Adopted beyond dataretrieval-python's set. Before the baseline fix, each had 0-4
  # findings (D103: 4, D100: 1, the rest 0), under the five-finding threshold, and
  # each was fixed without a behaviour change.
  "TC001", "D100", "D101", "D102", "D103", "D104",
]
ignore = ["SIM105", "SIM117"]

[tool.pyrefly]
project-includes = ["src/hydrotoolbox_dataretrieval"]
python-version = "3.12"
